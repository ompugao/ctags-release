name: Build and Release Universal Ctags

on:
  schedule:
    # Check for new releases weekly at 2 AM UTC, on Monday
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no new release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      latest_tag: ${{ steps.check.outputs.latest_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for new release
        id: check
        run: |
          # Get the latest release from universal-ctags
          LATEST_UPSTREAM=$(curl -s https://api.github.com/repos/universal-ctags/ctags/releases/latest | jq -r .tag_name)
          echo "Latest upstream release: $LATEST_UPSTREAM"

          # Get our latest release
          LATEST_OURS=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)
          if [ "$LATEST_OURS" = "null" ]; then
            LATEST_OURS="none"
          fi
          echo "Our latest release: $LATEST_OURS"

          # Check if we need to build
          if [ "$LATEST_UPSTREAM" != "$LATEST_OURS" ] || [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "latest_tag=$LATEST_UPSTREAM" >> $GITHUB_OUTPUT
            echo "New release detected or force build requested. Will build $LATEST_UPSTREAM"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "No new release detected"
          fi

  build:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            arch: x86_64
            container: ubuntu:20.04
          - os: ubuntu-latest
            target: linux-aarch64
            arch: aarch64
            use_qemu: true
            container: ubuntu:20.04
          - os: macos-14
            target: darwin-x86_64
            arch: x86_64
          - os: macos-latest
            target: darwin-aarch64
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup QEMU
        if: matrix.use_qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        if: matrix.container
        uses: docker/setup-buildx-action@v3

      - name: Checkout universal-ctags
        uses: actions/checkout@v4
        with:
          repository: universal-ctags/ctags
          ref: ${{ needs.check-release.outputs.latest_tag }}

      - name: Prepare static build Dockerfile
        if: matrix.container
        run: |
          cat > Dockerfile.static <<'EOF'
          FROM debian:12 AS build
          RUN apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential autoconf automake pkg-config libtool libpcre2-dev zlib1g-dev liblzma-dev \
            gettext ca-certificates git \
            libseccomp-dev libjansson-dev libyaml-dev libxml2-dev && rm -rf /var/lib/apt/lists/*
          WORKDIR /src
          COPY . .
          RUN ./autogen.sh
          ENV LDFLAGS="-static" PKG_CONFIG="pkg-config --static"
          RUN ./configure
          RUN make -j$(nproc)
          RUN ldd ./ctags || true
          RUN ./ctags --version
          FROM scratch AS output
          COPY --from=build /src/ctags /ctags
          EOF


      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install \
            autoconf \
            automake \
            pkg-config \
            jansson \
            libyaml \
            docutils

      - name: Build universal-ctags (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          ./autogen.sh
          ./configure \
            --prefix=/usr/local \
            --enable-json \
            --enable-yaml \
            --enable-xml
          make -j$(sysctl -n hw.ncpu)

      - name: Build universal-ctags (Linux static via Dockerfile.static)
        if: matrix.container
        run: |
          platform=linux/amd64
          if [ "${{ matrix.arch }}" = "aarch64" ]; then platform=linux/arm64; fi
          outdir=out-${{ matrix.target }}
          docker buildx build \
            --platform "${platform}" \
            -f Dockerfile.static \
            --output=type=local,dest="${outdir}" \
            .
          ls -l "${outdir}"
          cp "${outdir}/ctags" ./ctags
          strip ./ctags || true
          file ./ctags
          ldd ./ctags || true

      - name: Create binary package
        run: |
          mkdir -p dist

          # The ctags binary should be in the current directory after build
          # (either from native macOS build or from Docker container via mounted volume)
          if [ -f ctags ]; then
            cp ctags dist/ctags
          else
            echo "Error: ctags binary not found in current directory"
            ls -la
            exit 1
          fi

          # Strip the binary to reduce size
          # For Linux builds in Docker, we need to strip inside the container
          if [[ "${{ matrix.os }}" == ubuntu* ]] && [[ "${{ matrix.container }}" != "" ]]; then
            # For Docker-based Linux builds, strip was already done in container if possible
            echo "Binary built in Docker container, skipping strip on host"
          elif [[ "${{ matrix.os }}" == macos* ]]; then
            strip dist/ctags
          fi

          # Create tarball
          cd dist
          tar czf ctags-${{ needs.check-release.outputs.latest_tag }}-${{ matrix.target }}.tar.gz ctags

          # Also create a checksum
          if [[ "${{ matrix.os }}" == ubuntu* ]]; then
            sha256sum ctags-${{ needs.check-release.outputs.latest_tag }}-${{ matrix.target }}.tar.gz > ctags-${{ needs.check-release.outputs.latest_tag }}-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 ctags-${{ needs.check-release.outputs.latest_tag }}-${{ matrix.target }}.tar.gz > ctags-${{ needs.check-release.outputs.latest_tag }}-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ctags-${{ matrix.target }}
          path: dist/*

  release:
    needs: [check-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/*/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.check-release.outputs.latest_tag }}
          name: Universal Ctags ${{ needs.check-release.outputs.latest_tag }}
          body: |
            Universal Ctags binary release built from upstream version ${{ needs.check-release.outputs.latest_tag }}

            ## Installation

            ### Using mise

            Add to your `.mise.toml`:
            ```toml
            [tools]
            "github:ompugao/ctags-release" = "latest"
            ```

            Or install directly:
            ```bash
            mise use github:ompugao/ctags-release@latest
            ```

            ### Manual installation

            Download the appropriate binary for your platform and extract:
            ```bash
            tar xzf ctags-*.tar.gz
            sudo mv ctags /usr/local/bin/
            ```

            ## Supported Platforms
            - Linux x86_64 (fully static glibc)
            - Linux ARM64/aarch64 (fully static glibc)
            - macOS x86_64 (Intel, macOS 13+)
            - macOS ARM64 (Apple Silicon, macOS 13+)

            ## Compatibility
            - Linux binaries are fully statically linked with glibc using Dockerfile.static
            - No runtime library dependencies beyond the kernel (suitable for Alpine and older glibc hosts)
            - macOS builds are native dynamically linked binaries
            - If you encounter issues, open an issue with your platform details

            ## Features
            This build includes support for:
            - JSON output
            - YAML output
            - XML output
            - Seccomp sandbox (Linux only)

            ## Source
            Built from: https://github.com/universal-ctags/ctags/releases/tag/${{ needs.check-release.outputs.latest_tag }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
